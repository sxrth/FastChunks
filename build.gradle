def modern = project.findProperty("modern_minecraft")?.toString()?.toBoolean() ?: false

if (modern) {
    apply plugin: "net.fabricmc.fabric-loom"
} else {
    apply plugin: "net.fabricmc.fabric-loom-remap"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = "fastchunks-${project.minecraft_version}"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!modern) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_FastChunks" }
    }
}
