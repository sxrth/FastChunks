name: Build FastChunks

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FastChunks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Check Gradle
        run: gradle --version

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: List build files
        run: ls -lah build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FastChunks-JAR
          path: build/libs/*.jar
          if-no-files-found: error
