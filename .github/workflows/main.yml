name: Build FastChunks

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          # Minecraft 1.21
          - minecraft: "1.21"
            java: "21"
            loom: "1.6"
            loader: "0.15.11"
            fabric_api: "0.100.8+1.21"

          # Minecraft 1.21.1
          - minecraft: "1.21.1"
            java: "21"
            loom: "1.10.1"
            loader: "0.16.14"
            fabric_api: "0.116.17+1.21.1"

          # Minecraft 1.21.2
          - minecraft: "1.21.2"
            java: "21"
            loom: "1.8"
            loader: "0.16.7"
            fabric_api: "0.106.1+1.21.2"

          # Minecraft 1.21.3
          - minecraft: "1.21.3"
            java: "21"
            loom: "1.8"
            loader: "0.16.7"
            fabric_api: "0.106.1+1.21.3"

          # Minecraft 1.21.4
          - minecraft: "1.21.4"
            java: "21"
            loom: "1.9"
            loader: "0.16.9"
            fabric_api: "0.115.4+1.21.4"

          # Minecraft 1.21.5
          - minecraft: "1.21.5"
            java: "21"
            loom: "1.10"
            loader: "0.16.10"
            fabric_api: "0.126.0+1.21.5"

          # Minecraft 1.21.6
          - minecraft: "1.21.6"
            java: "21"
            loom: "1.10"
            loader: "0.16.14"
            fabric_api: "0.128.0+1.21.6"

          # Minecraft 1.21.7
          - minecraft: "1.21.7"
            java: "21"
            loom: "1.10"
            loader: "0.16.14"
            fabric_api: "0.129.0+1.21.7"

          # Minecraft 1.21.8
          - minecraft: "1.21.8"
            java: "21"
            loom: "1.10"
            loader: "0.17.2"
            fabric_api: "0.132.0+1.21.8"

          # Minecraft 1.21.9
          - minecraft: "1.21.9"
            java: "21"
            loom: "1.11"
            loader: "0.17.2"
            fabric_api: "0.134.0+1.21.9"

          # Minecraft 1.21.10
          - minecraft: "1.21.10"
            java: "21"
            loom: "1.11"
            loader: "0.17.2"
            fabric_api: "0.134.0+1.21.10"

          # Minecraft 1.21.11
          - minecraft: "1.21.11"
            java: "21"
            loom: "1.14"
            loader: "0.18.1"
            fabric_api: "0.141.1+1.21.11"

          # Minecraft 26.1
          - minecraft: "26.1"
            java: "25"
            loom: "1.15"
            loader: "0.18.4"
            fabric_api: "0.145.1+26.1"

          # Minecraft 26.1.1
          - minecraft: "26.1.1"
            java: "25"
            loom: "1.15"
            loader: "0.18.4"
            fabric_api: "0.145.4+26.1.1"

          # Minecraft 26.1.2
          - minecraft: "26.1.2"
            java: "25"
            loom: "1.15"
            loader: "0.19.3"
            fabric_api: "0.155.3+26.1.2"

          # Minecraft 26.2
          - minecraft: "26.2"
            java: "25"
            loom: "1.17-SNAPSHOT"
            loader: "0.19.3"
            fabric_api: "0.160.0+26.2"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Show versions
        run: |
          java -version
          gradle --version

      - name: Build
        run: |
          gradle clean build --no-daemon \
            -Pminecraft_version="${{ matrix.minecraft }}" \
            -Ploom_version="${{ matrix.loom }}" \
            -Ploader_version="${{ matrix.loader }}" \
            -Pfabric_api_version="${{ matrix.fabric_api }}"

      - name: Show JAR
        run: |
          echo "Built files:"
          ls -lah build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: FastChunks-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
